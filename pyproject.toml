[project]
name = "pmax-pipeline"
version = "0.2.0"
description = "Newsletter to Performance Max creative pipeline"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pmax = "pmax.cli:main"

[tool.setuptools.packages.find]
include = ["pmax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
